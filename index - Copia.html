                          <option value="09:45">09:45</option>
                          <option value="10:30">10:30</option>
                          <option value="11:15">11:15</option>
                          <option value="14:00">14:00</option>
                          <option value="14:45">14:45</option>
                          <option value="15:30">15:30</option>
                          <option value="16:15">16:15</option>

                          <option value="18:30">18:30</option>
                        </select>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-serif uppercase text-gray-400 mb-1">Seu Nome:</label>
                        <input
                          type="text"
                          required
                          value={clientName}
                          onChange={(e) => setClientName(e.target.value)}
                          placeholder="Ex: Carlos Eduardo"
                          className="w-full px-3.5 py-2.5 bg-[#0B0B0B] border border-[#2A261F] rounded-xl text-xs text-white"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-serif uppercase text-gray-400 mb-1">WhatsApp:</label>
                        <input
                          type="text"
                          required
                          value={clientPhone}
                          onChange={(e) => setClientPhone(e.target.value)}
                          placeholder="(21) 98888-7777"
                          className="w-full px-3.5 py-2.5 bg-[#0B0B0B] border border-[#2A261F] rounded-xl text-xs text-white"
                        />
                      </div>
                    </div>

                    <button type="submit" className="w-full py-3 bg-[#C9A356] hover:bg-[#B59044] text-black font-serif text-xs font-bold uppercase tracking-wider rounded-xl shadow">
                      Confirmar Horário • R$ {selectedService.price}
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ValverdsApp />);
  </script>
</body>

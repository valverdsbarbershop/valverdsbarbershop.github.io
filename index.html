  <style>
    * { 
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased; 
      -moz-osx-font-smoothing: grayscale; 
    }
    html, body {
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    #root {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    .app-container {
      width: 100%;
      max-width: 1440px;
      margin-left: auto;
      margin-right: auto;
      padding-left: 1rem;
      padding-right: 1rem;
    }
    @media (min-width: 640px) {
      .app-container { padding-left: 1.5rem; padding-right: 1.5rem; }
    }
    @media (min-width: 1024px) {
      .app-container { padding-left: 2rem; padding-right: 2rem; }
    }
    /* Barra de rolagem visivel e refinada (Obsidian & Gold) no navegador */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #12110E; }
    ::-webkit-scrollbar-thumb { 
      background: linear-gradient(180deg, #C9A356 0%, #8C6D2D 100%); 
      border-radius: 99px; 
      border: 2px solid #12110E;
    }
    ::-webkit-scrollbar-thumb:hover { 
      background: linear-gradient(180deg, #DFBD78 0%, #B59044 100%); 
    }
    * {
      scrollbar-width: thin;
      scrollbar-color: #C9A356 #12110E;
    }
    /* Protecao contra cursor/caret de texto piscando indevidamente */
    aside, nav, header, button, .select-none {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      caret-color: transparent !important;
    }
    input, textarea {
      caret-color: #C9A356 !important;
      user-select: text !important;
    }
    /* Estilização refinada do seletor nativo de data (calendário Dourado / Dark) */
    input[type="date"] {
      color-scheme: dark;
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(72%) sepia(50%) saturate(450%) hue-rotate(5deg) brightness(1.2);
      cursor: pointer;
      padding: 2px;
      border-radius: 4px;
      opacity: 0.95;
      transition: all 0.2s ease;
    }
    input[type="date"]::-webkit-calendar-picker-indicator:hover {
      filter: invert(85%) sepia(60%) saturate(800%) hue-rotate(5deg) brightness(1.4);
      transform: scale(1.15);
      opacity: 1;
    }
    .clean-mode input[type="date"] {
      color-scheme: light;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    /* Gradiente metálico de ouro nobre com profundidade */
    .gold-shimmer {
      background: linear-gradient(135deg, #C9A356 0%, #F5E0AA 40%, #C9A356 70%, #9E7D32 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }
    /* Divisor editorial de luxo */
    .gold-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, #C9A356 50%, transparent);
      margin: 1rem auto 1.5rem auto;
      width: 96px;
    }
    /* Animações fluidas de luxo */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.96) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-modal {
      animation: modalFadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* ========================================================================= */
    /* CLEAN MODE (PALETA LUXO QUENTE / CHAMPAGNE, MARFIM & DOURADO VALVERD'S)   */
    /* ========================================================================= */
    html.clean-mode,
    html.clean-mode body,
    html.clean-mode #root {
      background-color: #F7F5F0 !important;
      color: #1C1917 !important;
    }
    html.clean-mode main {
      background-color: #F7F5F0 !important;
      color: #1C1917 !important;
    }
    html.clean-mode aside {
      background-color: #FFFFFF !important;
      border-color: #E6E1D6 !important;
      color: #292524 !important;
    }
    html.clean-mode header {
      background-color: rgba(250, 248, 245, 0.98) !important;
      border-color: #E6E1D6 !important;
      color: #1C1917 !important;
      box-shadow: 0 1px 4px 0 rgba(40, 30, 20, 0.04) !important;
    }
    /* Superfícies e cartões viram warm white com bordas champagne douradas */
    html.clean-mode [class*="bg-[#"]:not([class*="bg-[#C9A356]"]):not([class*="bg-[#B59044]"]):not([class*="bg-[#DFBD78]"]):not([class*="bg-[#F5E0AA]"]):not([class*="bg-[#25D366]"]):not([class*="bg-[#20BD5A]"]),
    html.clean-mode [class*="bg-black"]:not([class*="text-black"]):not([class*="bg-black/"]):not([class*="hover:bg-black"]),
    html.clean-mode [class*="bg-gray-900"],
    html.clean-mode [class*="bg-gray-800"],
    html.clean-mode [class*="bg-stone-"],
    html.clean-mode [class*="bg-zinc-"] {
      background-color: #FFFFFF !important;
      color: #292524 !important;
      box-shadow: 0 1px 4px 0 rgba(40, 30, 20, 0.05), 0 1px 2px 0 rgba(40, 30, 20, 0.03) !important;
    }
    /* Bordas sutis em tom marfim/champagne quente que ornam com dourado */
    html.clean-mode [class*="border-[#"]:not([class*="border-[#C9A356]"]):not([class*="border-[#B59044]"]):not([class*="border-[#DFBD78]"]):not([class*="border-[#25D366]"]):not([class*="border-emerald-"]):not([class*="border-red-"]) {
      border-color: #E6E1D6 !important;
    }
    /* Textos executivos em espresso profundo de alto contraste */
    html.clean-mode .text-white {
      color: #1C1917 !important;
    }
    html.clean-mode [class*="text-[#E0"],
    html.clean-mode [class*="text-[#D8"],
    html.clean-mode [class*="text-[#D6"],
    html.clean-mode [class*="text-[#C5"],
    html.clean-mode [class*="text-[#F3"],
    html.clean-mode [class*="text-[#F5"] {
      color: #44403C !important;
    }
    html.clean-mode [class*="text-gray-400"],
    html.clean-mode [class*="text-gray-300"],
    html.clean-mode [class*="text-gray-500"] {
      color: #57534E !important;
    }
    /* Entradas e formulários com fundo suave e foco em dourado */
    html.clean-mode input,
    html.clean-mode select,
    html.clean-mode textarea {
      background-color: #FAF8F5 !important;
      color: #1C1917 !important;
      border-color: #D6CEBE !important;
    }
    html.clean-mode input:focus,
    html.clean-mode select:focus,
    html.clean-mode textarea:focus {
      background-color: #FFFFFF !important;
      border-color: #C9A356 !important;
      box-shadow: 0 0 0 2px rgba(201, 163, 86, 0.25) !important;
    }
    html.clean-mode input::placeholder,
    html.clean-mode textarea::placeholder {
      color: #A8A29E !important;
    }
    /* Tabelas refinadas */
    html.clean-mode table thead tr,
    html.clean-mode table th {
      background-color: #F4EFE6 !important;
      color: #44403C !important;
      border-color: #E6E1D6 !important;
    }
    html.clean-mode table td {
      color: #292524 !important;
      border-color: #F4EFE6 !important;
    }
    /* Modais */
    html.clean-mode .fixed.inset-0 {
      background-color: rgba(17, 24, 39, 0.65) !important;
    }
    html.clean-mode .animate-modal {
      background-color: #FFFFFF !important;
      color: #111827 !important;
      border-color: #E5E7EB !important;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04) !important;
    }
    /* Scrollbars */
    html.clean-mode ::-webkit-scrollbar-track {
      background: #F3F4F6 !important;
    }
    html.clean-mode ::-webkit-scrollbar-thumb {
      background: #D1D5DB !important;
    }
    html.clean-mode ::-webkit-scrollbar-thumb:hover {
      background: #C9A356 !important;
    }
  
    /* POPUPS: TRAVA FUNDO + SEMPRE CABER NA TELA */
    html.modal-open, html.modal-open body { overflow: hidden !important; touch-action: none; }
    .fixed.inset-0.z-50.flex.items-center.justify-center {
      padding: 12px !important;
      overscroll-behavior: contain;
      touch-action: auto;
    }
    .fixed.inset-0.z-50.flex.items-center.justify-center > * {
      max-height: calc(100vh - 24px);
      max-height: calc(100dvh - 24px);
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }
    @media (max-height: 760px) {
      .fixed.inset-0.z-50.flex.items-center.justify-center > * { padding: 18px !important; }
      .fixed.inset-0.z-50.flex.items-center.justify-center > * > * + * { margin-top: 12px !important; }
    }
    .modal-sticky-actions { position: sticky; bottom: -18px; z-index: 5; }
  </style>
</head>

    // Geração de semanas estritamente de Domingo a Sábado (padrão calendário oficial)
    const generateDynamicWeeks = (baseDate = new Date(), totalWeeksBefore = 8, totalWeeksAfter = 12) => {
      const current = new Date(baseDate);
      const dayOfWeek = current.getDay(); // 0 = Domingo
      const diffToSunday = -dayOfWeek;
      const sunday = new Date(current);
      sunday.setDate(current.getDate() + diffToSunday);

      const weeks = [];
      for (let offset = -totalWeeksBefore; offset <= totalWeeksAfter; offset++) {
        const weekSunday = new Date(sunday);
        weekSunday.setDate(sunday.getDate() + (offset * 7));

        const weekSaturday = new Date(weekSunday);
        weekSaturday.setDate(weekSunday.getDate() + 6);

        const sunDay = String(weekSunday.getDate()).padStart(2, '0');
        const sunMonth = String(weekSunday.getMonth() + 1).padStart(2, '0');
        const satDay = String(weekSaturday.getDate()).padStart(2, '0');
        const satMonth = String(weekSaturday.getMonth() + 1).padStart(2, '0');

        const days = [];
        for (let d = 0; d < 7; d++) {
          const dt = new Date(weekSunday);
          dt.setDate(weekSunday.getDate() + d);
          const dayNum = dt.getDate();
          const dayFormatted = `${String(dayNum).padStart(2, '0')}/${String(dt.getMonth() + 1).padStart(2, '0')}`;
          const isoFormatted = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;

            name: WEEKDAY_NAMES_PT[dt.getDay()],
            fullName: WEEKDAY_FULL_NAMES_PT[dt.getDay()],
            date: dayFormatted,
            isoDate: isoFormatted,
            num: dayNum
          });
        }

          id: offset,
          label: `${sunDay}/${sunMonth} a ${satDay}/${satMonth}`,
          sub: offset === 0 ? 'Semana Atual' : offset === -1 ? 'Semana Anterior' : offset === 1 ? 'Próxima Semana' : `Semana ${offset > 0 ? '+' : ''}${offset}`,
          days: days
        });
      }

    };

    const validateCPF = (cpf) => {
      if (!cpf) return false;
      const clean = cpf.replace(/\D/g, '');
      if (clean.length !== 11) return false;
      if (/^(\d)\1{10}$/.test(clean)) return false;
      let sum = 0;
      for (let i = 0; i < 9; i++) sum += parseInt(clean.charAt(i), 10) * (10 - i);
      let rev = 11 - (sum % 11);
      if (rev === 10 || rev === 11) rev = 0;
      if (rev !== parseInt(clean.charAt(9), 10)) return false;
      sum = 0;
      for (let i = 0; i < 10; i++) sum += parseInt(clean.charAt(i), 10) * (11 - i);
      rev = 11 - (sum % 11);
      if (rev === 10 || rev === 11) rev = 0;
      if (rev !== parseInt(clean.charAt(10), 10)) return false;
      return true;
    };

    async function neonQuery(sql, params = []) {
      try {
        const payload = {
          query: sql,
          params: Array.isArray(params) ? params : []
        };
        const res = await fetch(NEON_CONFIG.url, {
          method: 'POST',
          headers: {
            'neon-connection-string': NEON_CONFIG.conn
          },
          body: JSON.stringify(payload)
        });
        if (!res.ok) {
          const errText = await res.text();
          console.warn('Neon DB HTTP Warning:', res.status, errText);
          return null;
        }
        const data = await res.json();
        return data.rows || [];
      } catch (err) {
        console.warn('Neon DB connection error:', err);
        return null;
      }
    }

      const myCompletedToday = myTodaysAppointments.filter(a => a.status === 'concluido');
      const myRevenueToday = myCompletedToday.reduce((acc, a) => acc + a.price, 0);
      const myBarberObj = barbers.find(b => b.name === currentUser.name || b.barberKey === currentUser.barberKey);

      const myCommissionToday = myRevenueToday * myCommissionRate;

      // Dados para o Gráfico de Faturamento dos Barbeiros Dia a Dia (totalmente linkado com novos barbeiros)
      const barberDailyRevenueData = useMemo(() => {
        const days = currentWeek.days; // Dom, Seg, Ter, Qua, Qui, Sex, Sáb
        const list = barbers.map((b, idx) => {
          const color = getBarberColor(b.id || b.barberKey || b.name, barbers);
          const daily = {};
          days.forEach(d => { daily[d.name] = 0; });

          appointments.forEach(a => {
            const matchBarber = a.barber === b.name || a.barberKey === b.barberKey || a.barberKey === b.id || (b.name.includes('Luis') && a.barber && a.barber.includes('Luis')) || (b.name.includes('Yago') && a.barber && a.barber.includes('Yago'));
            if (matchBarber && a.status === 'concluido') {
              // Match day of current week
              const matchDay = days.find(d => d.name === a.day || d.isoDate === a.isoDate || d.date === a.date);
              if (matchDay) {
                daily[matchDay.name] += Number(a.total || a.price || 0);
              }
            }
          });

          const totalWeek = Object.values(daily).reduce((acc, v) => acc + v, 0);
          return {
            barber: b,
            color,
            daily,
            totalWeek
          };
        });

        let peakBarber = list[0]?.barber?.name || '';
        let peakDay = 'Seg';
        let peakVal = 0;

        list.forEach(item => {
          days.forEach(d => {
            const v = item.daily[d.name];
            if (v > peakVal) {
              peakVal = v;
              peakDay = d.name;
              peakBarber = item.barber.name;
            }
          });
        });

        return { days, list, peakBarber, peakDay, peakVal };
      }, [barbers, appointments, currentWeek]);

      // Dados para o Gráfico de Faturamento por Forma de Pagamento ao longo dos dias da semana
      const paymentMethodsData = useMemo(() => {
        const daysOfWeek = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
        const methods = ['PIX', 'DÉBITO', 'CRÉDITO', 'DINHEIRO'];
        
        const totalsByDayAndMethod = {};
        daysOfWeek.forEach(d => {
          totalsByDayAndMethod[d] = { PIX: 0, 'DÉBITO': 0, 'CRÉDITO': 0, DINHEIRO: 0, total: 0 };
        });

        appointments.forEach(a => {
          if (a.status === 'concluido' && a.day && totalsByDayAndMethod[a.day]) {
            const rawMethod = (a.paymentMethod || 'PIX').toUpperCase();
            const methodKey = rawMethod.includes('DÉB') || rawMethod.includes('DEB') ? 'DÉBITO' :
                              rawMethod.includes('CRÉD') || rawMethod.includes('CRED') ? 'CRÉDITO' :
                              rawMethod.includes('DIN') ? 'DINHEIRO' : 'PIX';
            const val = Number(a.total || a.price || 0);
            totalsByDayAndMethod[a.day][methodKey] += val;
            totalsByDayAndMethod[a.day].total += val;
          }
        });

        counterSales.forEach(s => {
          const rawMethod = (s.payment || 'PIX').toUpperCase();
          const methodKey = rawMethod.includes('DÉB') || rawMethod.includes('DEB') ? 'DÉBITO' :
                            rawMethod.includes('CRÉD') || rawMethod.includes('CRED') ? 'CRÉDITO' :
                            rawMethod.includes('DIN') ? 'DINHEIRO' : 'PIX';
          const day = 'Seg';
          if (totalsByDayAndMethod[day]) {
            totalsByDayAndMethod[day][methodKey] += Number(s.total || 0);
            totalsByDayAndMethod[day].total += Number(s.total || 0);
          }
        });

        const methodTotals = { PIX: 0, 'DÉBITO': 0, 'CRÉDITO': 0, DINHEIRO: 0 };
        let peakDay = 'Seg';
        let peakMethod = 'PIX';
        let peakVal = 0;

        daysOfWeek.forEach(d => {
          methods.forEach(m => {
            const v = totalsByDayAndMethod[d][m];
            methodTotals[m] += v;
            if (v > peakVal) {
              peakVal = v;
              peakDay = d;
              peakMethod = m;
            }
          });
        });

        return { daysOfWeek, methods, totalsByDayAndMethod, methodTotals, peakDay, peakMethod, peakVal };
      }, [appointments, counterSales]);

      // Dados para o Histórico e Desempenho detalhado de cada barbeiro

        return barbers.map(b => {

          let filtered = bAppts;

            filtered = bAppts.filter(a => a.isoDate === selectedAgendaDate || a.day === selectedAgendaWeekday);
          } else if (barberHistoryPeriod === 'semana') {
            filtered = bAppts.filter(a => a.weekId === currentWeek.id || (currentWeek.id === 0 && a.weekId === undefined));
          } else if (barberHistoryPeriod === 'mes') {
            const currIsoPrefix = selectedAgendaDate ? selectedAgendaDate.substring(0, 7) : '2026-10';
            filtered = bAppts.filter(a => !a.isoDate || a.isoDate.startsWith(currIsoPrefix));
          }

          const completed = filtered.filter(a => a.status === 'concluido');
          const noShows = filtered.filter(a => a.status === 'faltou' || a.status === 'recusado' || a.status === 'cancelado');
          const revenue = completed.reduce((acc, a) => acc + (a.total || a.price || 0), 0);
          const commission = revenue * (b.commissionRate / 100);
          const avgTicket = completed.length > 0 ? (revenue / completed.length) : 0;
          const totalScheduled = completed.length + noShows.length;
          const attendanceRate = totalScheduled > 0 ? Math.round((completed.length / totalScheduled) * 100) : 100;

          return {
            barber: b,
            all: filtered.sort((x, y) => (x.time || '').localeCompare(y.time || '')),
            completed,
            noShows,
            revenue,
            commission,
            avgTicket,
            attendanceRate
          };
        });

                      <button

                            </div>
                          ) : (

                  </div>
                  <span className="text-[10px] font-serif uppercase tracking-widest text-[#C9A356] font-bold">
                    RESERVA BLINDADA &amp; VOUCHER EMITIDO
                  </span>
                  <h3 className="font-serif text-2xl font-bold text-white">Agendamento Confirmado!</h3>
                  <p className="text-xs text-gray-400">Sua cadeira está garantida e reservada com exclusividade.</p>
                </div>

                {/* VOUCHER TICKET STYLE */}
                <div className="bg-[#1F1C16] border border-[#3A3326] rounded-2xl p-5 space-y-4 relative overflow-hidden">
                  <div className="flex justify-between items-center pb-3 border-b border-[#30291E]">
                    <div>
                      <span className="text-[10px] uppercase font-serif text-gray-400 block">Código do Voucher:</span>
                      <span className="font-mono text-lg font-bold text-[#C9A356] tracking-wider">
                        #{confirmedBookingModal.voucherCode}
                      </span>
                    </div>
                    <span className="text-[11px] font-bold text-emerald-400 bg-emerald-950/60 border border-emerald-700/50 px-2.5 py-1 rounded-full flex items-center gap-1">
                      <Icons.Check className="w-3.5 h-3.5" /> CPF Verificado
                    </span>
                  </div>

                  <div className="grid grid-cols-2 gap-3 text-xs">
                    <div>
                      <span className="text-[10px] uppercase text-gray-400 block font-serif">Cliente:</span>
                      <strong className="text-white">{confirmedBookingModal.client}</strong>
                    </div>
                    <div>
                      <span className="text-[10px] uppercase text-gray-400 block font-serif">Barbeiro:</span>
                      <strong className="text-[#C9A356]">{confirmedBookingModal.barber}</strong>
                    </div>
                    <div>
                      <span className="text-[10px] uppercase text-gray-400 block font-serif">Dia &amp; Horário:</span>
                      <strong className="text-white">{confirmedBookingModal.day}, {confirmedBookingModal.date} às {confirmedBookingModal.time}</strong>
                    </div>
                    <div>
                      <span className="text-[10px] uppercase text-gray-400 block font-serif">Serviço:</span>
                      <strong className="text-gray-200">{confirmedBookingModal.service}</strong>
                    </div>
                  </div>

                  <div className="pt-2 border-t border-[#30291E] flex justify-between items-center text-xs">
                    <span className="text-gray-400">Total a acertar no salão:</span>
                    <strong className="font-serif text-base text-[#C9A356]">
                      R$ {(confirmedBookingModal.price || confirmedBookingModal.total || 0).toFixed(2).replace('.', ',')}
                    </strong>
                  </div>
                </div>

                {/* REGRA ANTI NO-SHOW COMPROVANTE */}
                <div className="p-3.5 bg-[#12110E] rounded-xl border border-[#2B251B] text-[11px] text-gray-300 flex items-start gap-2.5">
                  <span className="text-base">🛡️</span>
                  <div>
                    <strong className="text-white block font-serif">Compromisso Anti No-Show:</strong>
                    Cancelamentos ou reagendamentos devem ser solicitados com no mínimo <strong>2 horas de antecedência</strong> para evitar suspensão do CPF no sistema.
                  </div>
                </div>

                {/* BOTÕES DE AÇÃO: 1-CLIQUE WHATSAPP */}
                <div className="space-y-2 pt-1">
                  <a
                    href={`https://wa.me/5521970100668?text=${encodeURIComponent(
                      `Olá Valverd's BarberShop! Acabei de realizar meu agendamento pelo app.\n\n` +
                      `🎟️ *VOUCHER #${confirmedBookingModal.voucherCode}*\n` +
                      `👤 *Cliente:* ${confirmedBookingModal.client}\n` +
                      `✂️ *Barbeiro:* ${confirmedBookingModal.barber}\n` +
                      `📅 *Data/Horário:* ${confirmedBookingModal.day} (${confirmedBookingModal.date}) às ${confirmedBookingModal.time}\n` +
                      `💼 *Serviço:* ${confirmedBookingModal.service}\n` +
                      `🔒 *CPF:* ${confirmedBookingModal.cpf || 'Verificado'}\n\n` +
                      `Confirmo minha presença!`
                    )}`}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="w-full py-3.5 bg-[#25D366] hover:bg-[#20BD5A] text-black font-serif text-xs font-bold uppercase tracking-wider rounded-2xl transition-all shadow-xl flex items-center justify-center gap-2"
                  >
                    <Icons.MessageCircle className="w-4 h-4 text-black" />
                    <span>Confirmar Reserva no WhatsApp da Barbearia</span>
                  </a>

                  <button
                    type="button"
                    onClick={() => setConfirmedBookingModal(null)}
                    className="w-full py-2.5 bg-[#1F1C16] hover:bg-[#28241D] text-gray-300 font-serif text-xs font-semibold rounded-2xl transition-all"
                  >
                    Fechar e Visualizar no Meu Painel
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ========================================================================= */}
          {/* MODAL: NOVO / EDITAR USUÁRIO                                              */}
          {/* ========================================================================= */}
          {isUserModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
              <div className="bg-[#161410] border border-[#2A261F] rounded-3xl max-w-md w-full p-6 text-white shadow-2xl space-y-4 animate-modal relative">
                <button
                  onClick={() => setIsUserModalOpen(false)}
                  className="absolute top-4 right-4 text-gray-400 hover:text-white p-1 rounded-lg hover:bg-[#201D17]"
                  aria-label="Fechar"
                >
                  <Icons.X className="w-5 h-5" />
                </button>

                <div className="text-center space-y-1">
                  <span className="text-[10px] font-serif uppercase tracking-widest text-[#C9A356] font-bold">
                    CONTROLE DE ACESSO
                  </span>
                  <h3 className="font-serif text-xl font-bold text-white">
                    {editingUserId ? 'Editar Usuário' : 'Novo Usuário'}
                  </h3>
                  <p className="text-xs text-gray-400">
                    {editingUserId ? 'Atualize as credenciais e permissões deste usuário.' : 'Cadastre um novo usuário com perfil de acesso na barbearia.'}
                  </p>
                </div>

                <form onSubmit={handleSaveUserModal} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-gray-400 uppercase font-serif mb-1">Nome Completo *</label>
                    <input
                      type="text"
                      required
                      placeholder="Ex: Carlos Eduardo"
                      value={userFormData.name}
                      onChange={e => setUserFormData({ ...userFormData, name: e.target.value })}
                      className="w-full px-3.5 py-2.5 bg-[#0B0B0B] border border-[#2A261F] rounded-xl text-white focus:outline-none focus:border-[#C9A356]"
                    />
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-gray-400 uppercase font-serif mb-1">E-mail *</label>
                      <input
                        type="email"
                        required
                        placeholder="usuario@valverds.com"
                        value={userFormData.email}
                        onChange={e => setUserFormData({ ...userFormData, email: e.target.value })}
                        className="w-full px-3.5 py-2.5 bg-[#0B0B0B] border border-[#2A261F] rounded-xl text-white focus:outline-none focus:border-[#C9A356]"
                      />
                    </div>
                    <div>
                      <label className="block text-gray-400 uppercase font-serif mb-1">Telefone / WhatsApp</label>
                      <input
                        type="text"
                        placeholder="(21) 98888-7777"
                        value={userFormData.phone}
                        onChange={e => setUserFormData({ ...userFormData, phone: e.target.value })}
                        className="w-full px-3.5 py-2.5 bg-[#0B0B0B] border border-[#2A261F] rounded-xl text-white focus:outline-none focus:border-[#C9A356]"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-gray-400 uppercase font-serif mb-1">Papel / Função</label>
                      <select
                        value={userFormData.role}
                        onChange={e => setUserFormData({ ...userFormData, role: e.target.value })}
                        className="w-full px-3.5 py-2.5 bg-[#0B0B0B] border border-[#2A261F] rounded-xl text-white focus:outline-none focus:border-[#C9A356]"
                      >
                        <option value="superadmin">Administrador</option>
                        <option value="dono">Proprietário (Gestão)</option>
                        <option value="barbeiro">Barbeiro Oficial</option>
                        <option value="recepcao">Recepção &amp; Balcão</option>
                        <option value="cliente">Cliente VIP</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-gray-400 uppercase font-serif mb-1">Status</label>
                      <select
                        value={userFormData.status}
                        onChange={e => setUserFormData({ ...userFormData, status: e.target.value })}
                        className="w-full px-3.5 py-2.5 bg-[#0B0B0B] border border-[#2A261F] rounded-xl text-white focus:outline-none focus:border-[#C9A356]"
                      >
                        <option value="Ativo">Ativo</option>
                        <option value="Inativo">Inativo</option>
                      </select>
                    </div>
                  </div>

                  <div className="pt-2 flex gap-3">
                    <button
                      type="button"
                      onClick={() => setIsUserModalOpen(false)}
                      className="flex-1 py-3 bg-[#1F1C16] hover:bg-[#28241D] text-gray-300 font-serif font-bold uppercase rounded-xl transition-all"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-3 bg-[#C9A356] hover:bg-[#B59044] text-black font-serif font-bold uppercase rounded-xl transition-all shadow"
                    >
                      {editingUserId ? 'Salvar Alterações' : 'Criar Usuário'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ========================================================================= */}
          {/* MODAL: NOVO / EDITAR CLIENTE (CRM & MARKETING)                            */}
          {/* ========================================================================= */}
          {isClientModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
              <div className="bg-[#161410] border border-[#2A261F] rounded-3xl max-w-md w-full p-6 text-white shadow-2xl space-y-4 animate-modal relative">
                <button
                  onClick={() => setIsClientModalOpen(false)}
                  className="absolute top-4 right-4 text-gray-400 hover:text-white p-1 rounded-lg hover:bg-[#201D17]"
                  aria-label="Fechar"
                >
                  <Icons.X className="w-5 h-5" />
                </button>

                <div className="text-center space-y-1">
                  <span className="text-[10px] font-serif uppercase tracking-widest text-[#C9A356] font-bold">
                    BASE DE CLIENTES &amp; MARKETING
                  </span>
                  <h3 className="font-serif text-xl font-bold text-white">
                    {editingClientId ? 'Editar Cliente' : 'Adicionar Cliente'}
                  </h3>
                  <p className="text-xs text-gray-400">
                    {editingClientId ? 'Atualize os dados cadastrais deste cliente.' : 'Cadastre um novo cliente para disparos e controle de relacionamento.'}
                  </p>
                </div>

                <form onSubmit={handleSaveClientModal} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-gray-400 uppercase font-serif mb-1">Nome do Cliente *</label>
                    <input
                      type="text"
                      required
                      placeholder="Ex: João da Silva"
                      value={clientFormData.name}
                      onChange={e => setClientFormData({ ...clientFormData, name: e.target.value })}
                      className="w-full px-3.5 py-2.5 bg-[#0B0B0B] border border-[#2A261F] rounded-xl text-white focus:outline-none focus:border-[#C9A356]"
                    />
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-gray-400 uppercase font-serif mb-1">WhatsApp *</label>
                      <input
                        type="text"
                        required
                        placeholder="(21) 98888-7777"
                        value={clientFormData.phone}
                        onChange={e => setClientFormData({ ...clientFormData, phone: e.target.value })}
                        className="w-full px-3.5 py-2.5 bg-[#0B0B0B] border border-[#2A261F] rounded-xl text-white focus:outline-none focus:border-[#C9A356]"
                      />
                    </div>
                    <div>
                      <label className="block text-gray-400 uppercase font-serif mb-1">E-mail</label>
                      <input
                        type="email"
                        placeholder="cliente@email.com"
                        value={clientFormData.email}
                        onChange={e => setClientFormData({ ...clientFormData, email: e.target.value })}
                        className="w-full px-3.5 py-2.5 bg-[#0B0B0B] border border-[#2A261F] rounded-xl text-white focus:outline-none focus:border-[#C9A356]"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-gray-400 uppercase font-serif mb-1">Aniversário (Dia/Mês)</label>
                      <input
                        type="text"
                        placeholder="Ex: 15/10"
                        value={clientFormData.birthDate}
                        onChange={e => setClientFormData({ ...clientFormData, birthDate: e.target.value })}
                        className="w-full px-3.5 py-2.5 bg-[#0B0B0B] border border-[#2A261F] rounded-xl text-white focus:outline-none focus:border-[#C9A356]"
                      />
                    </div>
                    <div>
                      <label className="block text-gray-400 uppercase font-serif mb-1">Origem do Cadastro</label>
                      <select
                        value={clientFormData.source}
                        onChange={e => setClientFormData({ ...clientFormData, source: e.target.value })}
                        className="w-full px-3.5 py-2.5 bg-[#0B0B0B] border border-[#2A261F] rounded-xl text-white focus:outline-none focus:border-[#C9A356]"
                      >
                        <option value="Instagram (Bio / Stories)">Instagram (Bio / Stories)</option>
                        <option value="WhatsApp (Link Direto / Indicação)">WhatsApp / Indicação</option>
                        <option value="Google Maps / Perfil de Empresa">Google Maps / Busca Local</option>
                        <option value="E-mail Marketing (Campanha)">E-mail Marketing</option>
                        <option value="Atendimento Presencial / Balcão">Presencial / Balcão</option>
                      </select>
                    </div>
                  </div>

                  <div className="pt-2 flex gap-3">
                    <button
                      type="button"
                      onClick={() => setIsClientModalOpen(false)}
                      className="flex-1 py-3 bg-[#1F1C16] hover:bg-[#28241D] text-gray-300 font-serif font-bold uppercase rounded-xl transition-all"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-3 bg-[#C9A356] hover:bg-[#B59044] text-black font-serif font-bold uppercase rounded-xl transition-all shadow"
                    >
                      {editingClientId ? 'Salvar Alterações' : 'Salvar Cliente'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* TOAST FLUTUANTE DE SUCESSO DO AGENDAMENTO */}
          {clientBookingSuccessToast && (
            <div className="fixed bottom-6 right-6 z-50 bg-[#161410] border-2 border-[#C9A356] text-white px-5 py-4 rounded-2xl shadow-2xl flex items-center gap-3 animate-fade-in max-w-sm">
              <div className="w-9 h-9 rounded-full bg-[#C9A356] text-black flex items-center justify-center font-bold shrink-0 shadow">
                <Icons.Check className="w-5 h-5" />
              </div>
              <div>
                <div className="font-serif font-bold text-sm text-[#C9A356]">Agendamento Confirmado!</div>
                <div className="text-xs text-gray-300 mt-0.5">Seu horário já foi reservado na agenda do barbeiro com sucesso.</div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ValverdsApp />);
  </script>
  <script id="valverds-modal-lock">
    (function () {
      var SEL = '.fixed.inset-0.z-50';
      var scrollY = 0, locked = false;
      function update() {
        var open = !!document.querySelector(SEL);
        if (open === locked) return;
        locked = open;
        var html = document.documentElement;
        if (open) {
          scrollY = window.scrollY || 0;
          html.classList.add('modal-open');
        } else {
          html.classList.remove('modal-open');
          window.scrollTo(0, scrollY);
        }
      }
      new MutationObserver(update).observe(document.documentElement, { childList: true, subtree: true });
    })();
  </script>
</body>
</html>

      -webkit-text-fill-color: transparent;
      display: inline-block;
    }
    /* Divisor editorial de luxo */

      height: 1px;
      background: linear-gradient(90deg, transparent, #C9A356 50%, transparent);
      margin: 1rem auto 1.5rem auto;
      width: 96px;
    }
    /* Animações fluidas de luxo */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.96) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-modal {
      animation: modalFadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;

    /* ========================================================================= */

    }

    }

      border-color: #E5E7EB !important;
      color: #111827 !important;
    }

    html.clean-mode [class*="bg-[#"]:not([class*="bg-[#C9A356]"]):not([class*="bg-[#B59044]"]):not([class*="bg-[#DFBD78]"]):not([class*="bg-[#F5E0AA]"]):not([class*="bg-[#25D366]"]):not([class*="bg-[#20BD5A]"]),

    html.clean-mode [class*="bg-gray-800"],
    html.clean-mode [class*="bg-stone-"],

      color: #1F2937 !important;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px 0 rgba(0, 0, 0, 0.03) !important;
    }
    /* Bordas escuras viram cinza claro refinado */
    html.clean-mode [class*="border-[#"]:not([class*="border-[#C9A356]"]):not([class*="border-[#B59044]"]):not([class*="border-[#DFBD78]"]):not([class*="border-[#25D366]"]):not([class*="border-emerald-"]):not([class*="border-red-"]) {
      border-color: #E5E7EB !important;
    }
    /* Textos claros e brancos viram preto/cinza executivo legível */
    html.clean-mode .text-white {
      color: #111827 !important;
    }
    html.clean-mode [class*="text-[#E0"],
    html.clean-mode [class*="text-[#D8"],
    html.clean-mode [class*="text-[#D6"],
    html.clean-mode [class*="text-[#C5"],

    html.clean-mode [class*="text-gray-300"],

    html.clean-mode input,

      color: #111827 !important;

      color: #374151 !important;
      border-color: #E5E7EB !important;

      background: #D1D5DB !important;
    }

</head>

    const validateCPF = (cpf) => {
      if (!cpf) return false;
      const clean = cpf.replace(/\D/g, '');
      if (clean.length !== 11) return false;
      if (/^(\d)\1{10}$/.test(clean)) return false;
      let sum = 0;
      for (let i = 0; i < 9; i++) sum += parseInt(clean.charAt(i), 10) * (10 - i);
      let rev = 11 - (sum % 11);
      if (rev === 10 || rev === 11) rev = 0;
      if (rev !== parseInt(clean.charAt(9), 10)) return false;
      sum = 0;
      for (let i = 0; i < 10; i++) sum += parseInt(clean.charAt(i), 10) * (11 - i);
      rev = 11 - (sum % 11);
      if (rev === 10 || rev === 11) rev = 0;
      if (rev !== parseInt(clean.charAt(10), 10)) return false;
      return true;
    };

      try {

          headers: {

        return acc + Math.max(0, (a.total || a.price) - (a.price || 0));
      }, 0);
      const revenueBalcao = counterSales.reduce((acc, s) => acc + s.total, 0);
      const totalBarRevenueToday = revenueBarFromAppts + revenueBalcao;

      // Custo unitário real de produtos e insumos
      const getProductCost = (productName) => {
        const prod = products.find(p => p.name === productName);
        if (prod && typeof prod.cost === 'number') return prod.cost;
        if (prod) return prod.price > 0 ? prod.price * 0.45 : 2;
        return 0;
      };

      // Soma real de comissões por barbeiro (calculada exclusivamente sobre serviços: Luis 60%, Yago 50%, bar a 0%)
      const totalTeamCommissionsToday = useMemo(() => {
        return completedToday.reduce((acc, a) => {
          const barberObj = barbers.find(b => b.name === a.barber || b.barberKey === a.barber || b.id === a.barber);
          const defaultRate = (a.barber && a.barber.includes('Luis')) ? 0.60 : 0.50;
          const rate = barberObj ? (barberObj.commissionRate / 100) : defaultRate;
          return acc + (a.price * rate);
        }, 0);
      }, [completedToday, barbers]);

        completedToday.forEach(appt => {
          if (Array.isArray(appt.items)) {
            appt.items.slice(1).forEach(item => {
              apptProductsCost += getProductCost(item.name);
            });
          }
        });
        let balcaoProductsCost = 0;
        counterSales.forEach(sale => {
          balcaoProductsCost += getProductCost(sale.item) * (sale.qty || 1);
        });
        return apptProductsCost + balcaoProductsCost;

                  </div>
                </div>

                <div className="pt-2">
                  <button
                    type="button"
                    onClick={() => setShowIosInstallModal(false)}
                    className="w-full py-2.5 bg-[#C9A356] hover:bg-[#B59044] text-black font-serif text-xs font-bold uppercase rounded-xl transition-all shadow"
                  >
                    Entendido
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ========================================================================= */}
          {/* MODAL: NOVO PRODUTO NO ESTOQUE                                            */}
          {/* ========================================================================= */}
          {isNewProductModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
              <div className="bg-[#161410] border border-[#2A261F] rounded-3xl max-w-md w-full p-6 text-white shadow-2xl space-y-4 animate-modal">
                <div className="flex justify-between items-start pb-3 border-b border-[#2A261F]">
                  <div>
                    <span className="text-[10px] font-serif uppercase tracking-widest text-[#C9A356] font-bold">ESTOQUE & INVENTÁRIO</span>
                    <h3 className="font-serif text-xl font-bold text-white mt-1">Cadastrar Novo Produto</h3>
                  </div>
                  <button onClick={() => setIsNewProductModalOpen(false)} aria-label="Fechar" className="p-1.5 rounded-full hover:bg-white/10 text-gray-400 hover:text-white transition-colors">
                    <Icons.X className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleAddNewProduct} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-gray-400 font-serif uppercase mb-1">Nome do Item:</label>
                    <input
                      type="text"
                      required
                      value={newProductForm.name}
                      onChange={e => setNewProductForm({ ...newProductForm, name: e.target.value })}
                      placeholder="Ex: Cerveja Stella Artois (330ml)"
                      className="w-full px-3.5 py-2 bg-[#0B0B0B] border border-[#2A261F] rounded-xl text-xs text-white"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-gray-400 font-serif uppercase mb-1">Categoria:</label>
                      <select
                        value={newProductForm.category}
                        onChange={e => setNewProductForm({ ...newProductForm, category: e.target.value })}
                        className="w-full px-3 py-2 bg-[#0B0B0B] border border-[#2A261F] rounded-xl text-xs text-white"
                      >
                        <option value="Bar">Bar</option>
                        <option value="Produtos">Produtos</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-gray-400 font-serif uppercase mb-1">Preço de Venda (R$):</label>
                      <input
                        type="number"
                        step="0.50"
                        required
                        value={newProductForm.price}
                        onChange={e => setNewProductForm({ ...newProductForm, price: e.target.value })}
                        className="w-full px-3 py-2 bg-[#0B0B0B] border border-[#2A261F] rounded-xl text-xs text-white font-bold"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-gray-400 font-serif uppercase mb-1">Estoque Inicial:</label>
                      <input
                        type="number"
                        min="1"
                        value={newProductForm.stock}
                        onChange={e => setNewProductForm({ ...newProductForm, stock: e.target.value })}
                        className="w-full px-3 py-2 bg-[#0B0B0B] border border-[#2A261F] rounded-xl text-xs text-white font-bold"
                      />
                    </div>
                    <div>
                      <label className="block text-gray-400 font-serif uppercase mb-1">Estoque Mínimo:</label>
                      <input
                        type="number"
                        min="1"
                        value={newProductForm.minStock}
                        onChange={e => setNewProductForm({ ...newProductForm, minStock: e.target.value })}
                        className="w-full px-3 py-2 bg-[#0B0B0B] border border-[#2A261F] rounded-xl text-xs text-white font-bold"
                      />
                    </div>
                  </div>

                  <div className="pt-2 flex gap-3">
                    <button
                      type="button"
                      onClick={() => setIsNewProductModalOpen(false)}
                      className="flex-1 py-2.5 bg-[#1F1C16] text-gray-300 font-serif text-xs font-bold uppercase rounded-xl"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2.5 bg-[#C9A356] hover:bg-[#B59044] text-black font-serif text-xs font-bold uppercase rounded-xl transition-all shadow flex items-center justify-center gap-1.5"
                    >
                      <Icons.Check className="w-3.5 h-3.5" />
                      <span>Salvar no Estoque</span>
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ========================================================================= */}
          {/* MODAL: PRIMEIRO ACESSO / SETUP MASTER DO PROPRIETÁRIO (LUIS VALVERDE)     */}
          {/* ========================================================================= */}
          {isFirstAccessModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md">
              <div className="bg-[#161410] border-2 border-[#C9A356] rounded-3xl max-w-lg w-full p-6 sm:p-8 text-white shadow-2xl space-y-6 animate-modal relative">
                <div className="text-center space-y-2">
                  <div className="w-14 h-14 rounded-full bg-[#C9A356]/20 border border-[#C9A356] text-[#C9A356] flex items-center justify-center mx-auto text-2xl shadow">
                    👑
                  </div>
                  <span className="text-[10px] font-serif uppercase tracking-widest text-[#C9A356] font-bold">
                    PRIMEIRO ACESSO DA BARBEARIA • SETUP OFICIAL
                  </span>
                  <h3 className="font-serif text-2xl font-bold text-white">Criar Conta Master do Dono</h3>
                  <p className="text-xs text-gray-400">
                    O banco de dados <strong>Neon PostgreSQL</strong> está conectado. Crie seu acesso de proprietário para iniciar as operações oficiais da Valverd's.
                  </p>
                </div>

                <form onSubmit={handleCreateMasterUser} className="space-y-4 text-xs">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-gray-300 font-serif uppercase mb-1 font-semibold">Nome Completo *</label>
                      <input
                        type="text"
                        required
                        value={firstAccessForm.name}
                        onChange={e => setFirstAccessForm({ ...firstAccessForm, name: e.target.value })}
                        className="w-full px-3.5 py-2.5 bg-[#0B0B0B] border border-[#2D271E] rounded-xl text-white font-bold focus:outline-none focus:border-[#C9A356]"
                      />
                    </div>
                    <div>
                      <label className="block text-gray-300 font-serif uppercase mb-1 font-semibold">WhatsApp Oficial *</label>
                      <input
                        type="text"
                        required
                        value={firstAccessForm.phone}
                        onChange={e => setFirstAccessForm({ ...firstAccessForm, phone: e.target.value })}
                        className="w-full px-3.5 py-2.5 bg-[#0B0B0B] border border-[#2D271E] rounded-xl text-white focus:outline-none focus:border-[#C9A356]"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-gray-300 font-serif uppercase mb-1 font-semibold">E-mail de Acesso do Dono *</label>
                    <input
                      type="email"
                      required
                      placeholder="Ex: luis@valverdsbarbershop.com.br"
                      value={firstAccessForm.email}
                      onChange={e => setFirstAccessForm({ ...firstAccessForm, email: e.target.value })}
                      className="w-full px-3.5 py-2.5 bg-[#0B0B0B] border border-[#2D271E] rounded-xl text-white focus:outline-none focus:border-[#C9A356]"
                    />
                    <span className="text-[10px] text-gray-500 block mt-1">Este e-mail terá acesso irrestrito ao DRE, financeiro e equipe.</span>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-gray-300 font-serif uppercase mb-1 font-semibold">Senha Master *</label>
                      <input
                        type="password"
                        required
                        placeholder="Mínimo 6 dígitos"
                        value={firstAccessForm.password}
                        onChange={e => setFirstAccessForm({ ...firstAccessForm, password: e.target.value })}
                        className="w-full px-3.5 py-2.5 bg-[#0B0B0B] border border-[#2D271E] rounded-xl text-white focus:outline-none focus:border-[#C9A356]"
                      />
                    </div>
                    <div>
                      <label className="block text-gray-300 font-serif uppercase mb-1 font-semibold">Confirmar Senha *</label>
                      <input
                        type="password"
                        required
                        placeholder="Repita a senha"
                        value={firstAccessForm.confirmPassword}
                        onChange={e => setFirstAccessForm({ ...firstAccessForm, confirmPassword: e.target.value })}
                        className="w-full px-3.5 py-2.5 bg-[#0B0B0B] border border-[#2D271E] rounded-xl text-white focus:outline-none focus:border-[#C9A356]"
                      />
                    </div>
                  </div>

                  <div className="p-3 bg-[#1B1914] rounded-2xl border border-[#3A3222] text-[11px] text-gray-300 space-y-1">
                    <strong className="text-[#C9A356] font-serif block">Permissões da Conta Master:</strong>
                    <p>• Visualização e controle total de faturamento diário/semanal e DRE.</p>
                    <p>• Gerenciamento das Cadeira 01 (Luis) e Cadeira 02 (Yago) com cálculo de comissões.</p>
                    <p>• Base de agendamentos limpa e conectada em tempo real com o Neon Cloud.</p>
                  </div>

                  <div className="pt-2">
                    <button
                      type="submit"
                      className="w-full py-3.5 bg-[#C9A356] hover:bg-[#B59044] text-black font-serif text-xs font-bold uppercase tracking-wider rounded-2xl transition-all shadow-xl flex items-center justify-center gap-2"
                    >
                      <Icons.Check className="w-4 h-4" />
                      <span>Criar Conta Master &amp; Iniciar Barbearia</span>
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ========================================================================= */}
          {/* MODAL: LOGIN DA EQUIPE (DONO / BARBEIRO / RECEPÇÃO)                        */}
          {/* ========================================================================= */}
          {isLoginModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
              <div className="bg-[#161410] border border-[#2D271E] rounded-3xl max-w-sm w-full p-6 text-white shadow-2xl space-y-4 animate-modal relative">
                <button
                  onClick={() => setIsLoginModalOpen(false)}
                  className="absolute top-4 right-4 text-gray-400 hover:text-white p-1 rounded-lg hover:bg-[#201D17]"
                  aria-label="Fechar"
                >
                  <Icons.X className="w-5 h-5" />
                </button>

                <div className="text-center space-y-1">
                  <span className="text-[10px] font-serif uppercase tracking-widest text-[#C9A356] font-bold">
                    ÁREA DA EQUIPE
                  </span>
                  <h3 className="font-serif text-xl font-bold text-white">Entrar no Sistema</h3>
                  <p className="text-xs text-gray-400">Acesse com seu e-mail e senha cadastrados.</p>
                </div>

                {loginError && (
                  <div className="p-2.5 bg-red-950/60 border border-red-800/60 text-red-200 rounded-xl text-xs text-center font-bold">
                    {loginError}
                  </div>
                )}

                <form onSubmit={handleLogin} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-gray-400 uppercase font-serif mb-1">E-mail:</label>
                    <input
                      type="email"
                      required
                      placeholder="seu@email.com"
                      value={loginForm.email}
                      onChange={e => setLoginForm({ ...loginForm, email: e.target.value })}
                      className="w-full px-3.5 py-2.5 bg-[#0B0B0B] border border-[#2A261F] rounded-xl text-white focus:outline-none focus:border-[#C9A356]"
                    />
                  </div>

                  <div>
                    <label className="block text-gray-400 uppercase font-serif mb-1">Senha:</label>
                    <input
                      type="password"
                      required
                      placeholder="••••••••"
                      value={loginForm.password}
                      onChange={e => setLoginForm({ ...loginForm, password: e.target.value })}
                      className="w-full px-3.5 py-2.5 bg-[#0B0B0B] border border-[#2A261F] rounded-xl text-white focus:outline-none focus:border-[#C9A356]"
                    />
                  </div>

                  <div className="pt-2">
                    <button
                      type="submit"
                      className="w-full py-3 bg-[#C9A356] hover:bg-[#B59044] text-black font-serif text-xs font-bold uppercase rounded-xl transition-all shadow"
                    >
                      Acessar Painel
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ========================================================================= */}
          {/* MODAL: VOUCHER EXCLUSIVO & CONFIRMAÇÃO ANTI NO-SHOW                       */}
          {/* ========================================================================= */}
          {confirmedBookingModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
              <div className="bg-[#161410] border-2 border-[#C9A356]/60 rounded-3xl max-w-lg w-full p-6 sm:p-8 text-white shadow-2xl space-y-6 animate-modal relative">
                <button
                  onClick={() => setConfirmedBookingModal(null)}
                  className="absolute top-5 right-5 text-gray-400 hover:text-white p-1 rounded-lg hover:bg-[#201D17] transition-all"
                  aria-label="Fechar"
                >
                  <Icons.X className="w-5 h-5" />
                </button>

                <div className="text-center space-y-1">
                  <div className="w-14 h-14 rounded-full bg-[#C9A356]/20 border border-[#C9A356] text-[#C9A356] flex items-center justify-center mx-auto text-2xl mb-2 font-bold shadow">
                    ✓
                  </div>
                  <span className="text-[10px] font-serif uppercase tracking-widest text-[#C9A356] font-bold">
                    RESERVA BLINDADA &amp; VOUCHER EMITIDO
                  </span>
                  <h3 className="font-serif text-2xl font-bold text-white">Agendamento Confirmado!</h3>
                  <p className="text-xs text-gray-400">Sua cadeira está garantida e reservada com exclusividade.</p>
                </div>

                {/* VOUCHER TICKET STYLE */}
                <div className="bg-[#1F1C16] border border-[#3A3326] rounded-2xl p-5 space-y-4 relative overflow-hidden">
                  <div className="flex justify-between items-center pb-3 border-b border-[#30291E]">
                    <div>
                      <span className="text-[10px] uppercase font-serif text-gray-400 block">Código do Voucher:</span>
                      <span className="font-mono text-lg font-bold text-[#C9A356] tracking-wider">
                        #{confirmedBookingModal.voucherCode}
                      </span>
                    </div>
                    <span className="text-[11px] font-bold text-emerald-400 bg-emerald-950/60 border border-emerald-700/50 px-2.5 py-1 rounded-full flex items-center gap-1">
                      <Icons.Check className="w-3.5 h-3.5" /> CPF Verificado
                    </span>
                  </div>

                  <div className="grid grid-cols-2 gap-3 text-xs">
                    <div>
                      <span className="text-[10px] uppercase text-gray-400 block font-serif">Cliente:</span>
                      <strong className="text-white">{confirmedBookingModal.client}</strong>
                    </div>
                    <div>
                      <span className="text-[10px] uppercase text-gray-400 block font-serif">Barbeiro:</span>
                      <strong className="text-[#C9A356]">{confirmedBookingModal.barber}</strong>
                    </div>
                    <div>
                      <span className="text-[10px] uppercase text-gray-400 block font-serif">Dia &amp; Horário:</span>
                      <strong className="text-white">{confirmedBookingModal.day}, {confirmedBookingModal.date} às {confirmedBookingModal.time}</strong>
                    </div>
                    <div>
                      <span className="text-[10px] uppercase text-gray-400 block font-serif">Serviço:</span>
                      <strong className="text-gray-200">{confirmedBookingModal.service}</strong>
                    </div>
                  </div>

                  <div className="pt-2 border-t border-[#30291E] flex justify-between items-center text-xs">
                    <span className="text-gray-400">Total a acertar no salão:</span>
                    <strong className="font-serif text-base text-[#C9A356]">
                      R$ {(confirmedBookingModal.price || confirmedBookingModal.total || 0).toFixed(2).replace('.', ',')}
                    </strong>
                  </div>
                </div>

                {/* REGRA ANTI NO-SHOW COMPROVANTE */}
                <div className="p-3.5 bg-[#12110E] rounded-xl border border-[#2B251B] text-[11px] text-gray-300 flex items-start gap-2.5">
                  <span className="text-base">🛡️</span>
                  <div>
                    <strong className="text-white block font-serif">Compromisso Anti No-Show:</strong>
                    Cancelamentos ou reagendamentos devem ser solicitados com no mínimo <strong>2 horas de antecedência</strong> para evitar suspensão do CPF no sistema.
                  </div>
                </div>

                {/* BOTÕES DE AÇÃO: 1-CLIQUE WHATSAPP */}
                <div className="space-y-2 pt-1">
                  <a
                    href={`https://wa.me/5521970100668?text=${encodeURIComponent(
                      `Olá Valverd's BarberShop! Acabei de realizar meu agendamento pelo app.\n\n` +
                      `🎟️ *VOUCHER #${confirmedBookingModal.voucherCode}*\n` +
                      `👤 *Cliente:* ${confirmedBookingModal.client}\n` +
                      `✂️ *Barbeiro:* ${confirmedBookingModal.barber}\n` +
                      `📅 *Data/Horário:* ${confirmedBookingModal.day} (${confirmedBookingModal.date}) às ${confirmedBookingModal.time}\n` +
                      `💼 *Serviço:* ${confirmedBookingModal.service}\n` +
                      `🔒 *CPF:* ${confirmedBookingModal.cpf || 'Verificado'}\n\n` +
                      `Confirmo minha presença!`
                    )}`}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="w-full py-3.5 bg-[#25D366] hover:bg-[#20BD5A] text-black font-serif text-xs font-bold uppercase tracking-wider rounded-2xl transition-all shadow-xl flex items-center justify-center gap-2"
                  >
                    <Icons.MessageCircle className="w-4 h-4 text-black" />
                    <span>Confirmar Reserva no WhatsApp da Barbearia</span>
                  </a>

                  <button
                    type="button"
                    onClick={() => setConfirmedBookingModal(null)}
                    className="w-full py-2.5 bg-[#1F1C16] hover:bg-[#28241D] text-gray-300 font-serif text-xs font-semibold rounded-2xl transition-all"
                  >
                    Fechar e Visualizar no Meu Painel
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* TOAST FLUTUANTE DE SUCESSO DO AGENDAMENTO */}
          {clientBookingSuccessToast && (
            <div className="fixed bottom-6 right-6 z-50 bg-[#161410] border-2 border-[#C9A356] text-white px-5 py-4 rounded-2xl shadow-2xl flex items-center gap-3 animate-fade-in max-w-sm">
              <div className="w-9 h-9 rounded-full bg-[#C9A356] text-black flex items-center justify-center font-bold shrink-0 shadow">
                <Icons.Check className="w-5 h-5" />
              </div>
              <div>
                <div className="font-serif font-bold text-sm text-[#C9A356]">Agendamento Confirmado!</div>
                <div className="text-xs text-gray-300 mt-0.5">Seu horário já foi reservado na agenda do barbeiro com sucesso.</div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ValverdsApp />);
  </script>
</body>
</html>

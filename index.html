    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['Cinzel', 'Playfair Display', 'Georgia', 'serif'],
              sans: ['Plus Jakarta Sans', '-apple-system', 'sans-serif']
            },
            colors: {
              gold: { DEFAULT: '#C9A356', light: '#DFBD78', dark: '#A68238', hover: '#B59044' },

    <style>
      * { box-sizing: border-box; }
      html, body, #root { min-height: 100%; margin: 0; background: #0B0B0B; }
      body { overflow-x: hidden; -webkit-font-smoothing: antialiased; }
      ::-webkit-scrollbar { width: 10px; }
      ::-webkit-scrollbar-track { background: #12110E; }
      ::-webkit-scrollbar-thumb { background: #C9A356; border-radius: 99px; border: 2px solid #12110E; }

  </head>
  <body class="bg-[#0B0B0B] text-[#E0DDD5] font-sans antialiased">
    <div id="root"></div>
    <script>
      (function () {
        var selector = '.fixed.inset-0.z-50';
        var locked = false;
        new MutationObserver(function () {
          var open = !!document.querySelector(selector);
          if (open === locked) return;
          locked = open;
          document.documentElement.classList.toggle('modal-open', open);
        }).observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(function () {});
      }
    </script>
  </body>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Valverd's — rascunho do painel da equipe (não oficial)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --forest: #07110C;
    --panel: #0F1E16;
    --panel-2: #132619;
    --line: #23382B;
    --leaf: #2F6B45;
    --gold: #D6B15E;
    --bone: #F1EBDD;
    --muted: #A9B3A8;
    --wait: #E0A04B;
    --live: #6FBF8B;
    --done: #7E8C82;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--forest); color: var(--bone);
    font-family: 'Manrope', system-ui, sans-serif; font-size: 16px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 8px; }
  .app { max-width: 560px; margin: 0 auto; padding-bottom: 110px; }

  .draft-flag { background: var(--gold); color: var(--forest); font-size: 12.5px; font-weight: 700; text-align: center; padding: 6px 10px; }

  /* Topo */
  .top { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 6px; }
  .top .who { display: flex; align-items: center; gap: 12px; }
  .top img { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--gold); background: #000; }
  .top h1 { font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 20px; margin: 0; }
  .top small { display: block; color: var(--muted); font-size: 13px; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--panel-2); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 800; color: var(--gold); }

  /* Números do dia */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px 18px 4px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; }
  .stat b { display: block; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 18px; }
  .stat span { font-size: 12.5px; color: var(--muted); }
  .stat.money b { color: var(--gold); }

  /* Dias da semana */
  .days { display: flex; gap: 8px; overflow-x: auto; padding: 16px 18px 6px; scrollbar-width: none; }
  .days::-webkit-scrollbar { display: none; }
  .day {
    flex: 0 0 auto; width: 62px; padding: 8px 0 10px; border-radius: 16px; text-align: center;
    background: var(--panel); border: 1px solid var(--line);
  }
  .day .wd { font-size: 12px; color: var(--muted); }
  .day .n { display: block; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 18px; margin: 2px 0 4px; }
  .day .load { display: block; height: 4px; margin: 0 12px; border-radius: 4px; background: #0A1710; overflow: hidden; }
  .day .load i { display: block; height: 100%; background: var(--leaf); }
  .day .c { display: block; font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  .day[aria-pressed="true"] { background: var(--bone); border-color: var(--bone); color: var(--forest); }
  .day[aria-pressed="true"] .wd, .day[aria-pressed="true"] .c { color: #3A4A3F; }
  .day[aria-pressed="true"] .load { background: #D9D2C2; }
  .day.closed { opacity: 0.45; }

  /* Barbeiro */
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 12px 18px 0; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; }
  .seg button { border: 0; background: transparent; padding: 9px 0; border-radius: 999px; font-weight: 700; font-size: 14px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--gold); color: var(--forest); }

  /* Linha do tempo vertical */
  .timeline { position: relative; margin: 18px 18px 0; }
  .hourline { position: absolute; left: 0; right: 0; height: 1px; background: var(--line); }
  .hourline span { position: absolute; left: 0; top: -9px; font-size: 12px; color: var(--muted); background: var(--forest); padding-right: 6px; }
  .now { position: absolute; left: 44px; right: 0; height: 2px; background: var(--bone); z-index: 3; }
  .now::before { content: ''; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--bone); }
  .now span { position: absolute; left: -44px; top: -9px; font-size: 11.5px; font-weight: 800; color: var(--forest); background: var(--bone); border-radius: 6px; padding: 0 4px; }
  .appt.compact { align-items: center; padding-top: 4px; padding-bottom: 4px; }
  .appt.compact .go { padding: 6px 12px; }
  .appt.compact .more { width: 30px; height: 30px; }

  .slot { position: absolute; left: 52px; right: 0; border-radius: 16px; overflow: hidden; }
  .appt {
    background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--gold);
    padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start; justify-content: space-between;
  }
  .appt.s-aguardando { border-left-color: var(--wait); }
  .appt.s-atendendo { border-left-color: var(--live); background: #12261A; }
  .appt.s-concluido { border-left-color: var(--done); opacity: 0.62; }
  .appt .info { min-width: 0; }
  .appt .t { font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 13.5px; color: var(--gold); }
  .appt .name { font-weight: 800; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .appt .svc { font-size: 13.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .appt .state { font-size: 12px; font-weight: 700; margin-top: 2px; }
  .s-confirmado .state { color: var(--gold); }
  .s-aguardando .state { color: var(--wait); }
  .s-atendendo .state { color: var(--live); }
  .s-concluido .state { color: var(--done); }
  .appt .acts { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
  .go { border: 0; border-radius: 999px; padding: 9px 14px; font-weight: 800; font-size: 13.5px; background: var(--gold); color: var(--forest); }
  .s-aguardando .go { background: var(--wait); }
  .s-atendendo .go { background: var(--live); }
  .more { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: transparent; font-size: 18px; line-height: 1; }

  .free {
    border: 1px dashed #3B5A46; background: rgba(47, 107, 69, 0.08); height: 100%;
    display: flex; align-items: center; justify-content: space-between; padding: 0 12px;
    font-size: 13.5px; color: var(--muted); border-radius: 16px;
  }
  .free button { border: 1px solid var(--gold); background: transparent; color: var(--gold); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 13px; }

  .closed-msg { margin: 26px 18px; padding: 18px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }

  /* Menu ⋯ */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; z-index: 20; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; background: var(--panel); border-top: 1px solid var(--line); border-radius: 24px 24px 0 0; padding: 18px 18px 28px; display: none; z-index: 21; }
  .sheet h3 { margin: 0 0 4px; font-size: 17px; }
  .sheet p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .sheet button { display: block; width: 100%; text-align: left; padding: 13px 14px; margin-bottom: 8px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel-2); font-weight: 700; }
  .sheet button.danger { color: #E29A86; }
  .open .sheet-bg, .open .sheet { display: block; }

  /* Botão de encaixe e barra de baixo */
  .fab { position: fixed; right: max(18px, calc(50% - 262px)); bottom: 92px; border: 0; border-radius: 999px; padding: 14px 20px; font-weight: 800; background: var(--gold); color: var(--forest); box-shadow: 0 10px 30px rgba(0,0,0,.45); z-index: 10; }
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: rgba(10, 23, 16, 0.94); backdrop-filter: blur(12px); border-top: 1px solid var(--line);
    padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
  }
  .tabbar .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
  .tabbar button { border: 0; background: transparent; padding: 6px 0; font-size: 12px; font-weight: 700; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .tabbar svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .tabbar button[aria-current="page"] { color: var(--gold); }
</style>
</head>
<body>
<div class="draft-flag">Rascunho do painel da equipe — não é o sistema oficial. Nomes e horários inventados.</div>

<div class="app" id="app">
  <header class="top">
    <div class="who">
      <img src="https://valverdsbarbershop.com.br/logo_valverds_clean.png" alt="">
      <div>
        <h1>Agenda</h1>
        <small id="dateLabel"></small>
      </div>
    </div>
    <div class="avatar" title="Conta">B</div>
  </header>

  <div class="stats" aria-label="Números do dia">
    <div class="stat money"><b id="stMoney">R$ 0</b><span>faturado</span></div>
    <div class="stat"><b id="stCount">0</b><span>agendados</span></div>
    <div class="stat"><b id="stFree">0</b><span>horários livres</span></div>
  </div>

  <div class="days" id="days" role="group" aria-label="Dia"></div>

  <div class="seg" role="group" aria-label="Barbeiro">
    <button type="button" data-b="luis" aria-pressed="true">Luis</button>
    <button type="button" data-b="yago" aria-pressed="false">Yago</button>
    <button type="button" data-b="todos" aria-pressed="false">Todos</button>
  </div>

  <div id="dayView"></div>
</div>

<button class="fab" type="button" onclick="alert('Rascunho: aqui abriria o encaixe.')">+ Encaixe</button>

<nav class="tabbar" aria-label="Seções do painel">
  <div class="in">
    <button type="button" aria-current="page"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Agenda</button>
    <button type="button"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M7 15h4"/></svg>Caixa</button>
    <button type="button"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 4.5a3.5 3.5 0 0 1 0 7M21 20c0-2.6-1.6-4.8-4-5.6"/></svg>Equipe</button>
    <button type="button"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>Mais</button>
  </div>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <h3 id="sheetTitle"></h3>
  <p id="sheetSub"></p>
  <button type="button">Chamar no WhatsApp</button>
  <button type="button">Cliente avisou que vai</button>
  <button type="button">Editar horário ou valor</button>
  <button type="button" class="danger">Marcar falta</button>
  <button type="button" class="danger">Cancelar horário</button>
</div>

<script>
  // ---- Dados inventados para o rascunho ----
  const START = 9 * 60, END = 19 * 60 + 30, PX_PER_MIN = 2.4;
  const NOW = 11 * 60 + 40;
  const TODAY = 5; // índice do dia de hoje na semana mostrada (sexta)
  const week = [
    { wd: 'Dom', n: 25, closed: true }, { wd: 'Seg', n: 26 }, { wd: 'Ter', n: 27 }, { wd: 'Qua', n: 28 },
    { wd: 'Qui', n: 29 }, { wd: 'Sex', n: 30 }, { wd: 'Sáb', n: 31 }
  ];
  const services = {
    corte: ['Corte Degradê', 40, 30], sobr: ['Corte com Sobrancelha', 45, 30], pig: ['Corte + Pigmentação + Sobrancelha', 60, 40],
    combo: ['Combo Cabelo + Barba', 65, 60], tudo: ['Cabelo + Sobrancelha + Barba', 70, 60], pez: ['Pezinho & Acabamento', 20, 20]
  };
  const names = ['Rafael M.', 'Diego S.', 'Lucas P.', 'Mateus R.', 'Pedro H.', 'João V.', 'Caio L.', 'Bruno A.', 'Thiago C.', 'Igor F.', 'André N.', 'Vitor G.'];
  function makeDay(seed, barber) {
    const plans = {
      luis: [['09:00', 'pig'], ['10:00', 'sobr'], ['11:00', 'combo'], ['13:00', 'tudo'], ['14:30', 'sobr'], ['15:30', 'corte'], ['16:30', 'combo'], ['18:00', 'corte']],
      yago: [['09:30', 'corte'], ['10:30', 'combo'], ['12:00', 'pez'], ['14:00', 'pig'], ['15:00', 'sobr'], ['17:00', 'tudo']]
    }[barber];
    return plans.filter((_, i) => (i + seed) % 5 !== 4).map(([t, s], i) => {
      const [h, m] = t.split(':').map(Number);
      const start = h * 60 + m;
      const [svc, price, dur] = services[s];
      let status = 'confirmado';
      if (seed === TODAY) {
        if (start + dur <= NOW) status = 'concluido';
        else if (start <= NOW) status = 'atendendo';
        else if (start - NOW <= 30) status = 'aguardando';
      } else if (seed < TODAY) status = 'concluido';
      return { id: `${barber}-${seed}-${i}`, start, dur, name: names[(i * 3 + seed + (barber === 'yago' ? 5 : 0)) % names.length], svc, price, status, barber };
    });
  }
  const data = {};
  week.forEach((d, i) => { data[i] = d.closed ? { luis: [], yago: [] } : { luis: makeDay(i, 'luis'), yago: makeDay(i, 'yago') }; });

  // ---- Estado ----
  let dayIdx = TODAY, barber = 'luis';
  const hhmm = (m) => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  const STATE = {
    confirmado: { label: 'Confirmado', next: 'aguardando', action: 'Chegou' },
    aguardando: { label: 'Chegou, aguardando', next: 'atendendo', action: 'Iniciar' },
    atendendo:  { label: 'Em atendimento', next: 'concluido', action: 'Cobrar' },
    concluido:  { label: 'Concluído e pago', next: null, action: null }
  };

  function freeGaps(list) {
    const gaps = []; let cursor = START;
    list.slice().sort((a, b) => a.start - b.start).forEach(a => {
      if (a.start - cursor >= 30) gaps.push([cursor, a.start]);
      cursor = Math.max(cursor, a.start + a.dur);
    });
    if (END - cursor >= 30) gaps.push([cursor, END]);
    return gaps;
  }

  function render() {
    const d = week[dayIdx];
    const fullNames = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
    document.getElementById('dateLabel').textContent = `${fullNames[dayIdx]}, ${d.n} de outubro${dayIdx === TODAY ? ' (hoje)' : ''}`;

    // Dias
    const daysEl = document.getElementById('days');
    daysEl.innerHTML = '';
    week.forEach((w, i) => {
      const count = data[i].luis.length + data[i].yago.length;
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'day' + (w.closed ? ' closed' : '');
      b.setAttribute('aria-pressed', String(i === dayIdx));
      b.innerHTML = `<span class="wd">${i === TODAY ? 'Hoje' : w.wd}</span><span class="n">${w.n}</span><span class="load"><i style="width:${Math.min(100, count / 16 * 100)}%"></i></span><span class="c">${w.closed ? 'fechado' : count + ' ag.'}</span>`;
      b.onclick = () => { dayIdx = i; render(); };
      daysEl.appendChild(b);
    });

    // Barbeiro
    document.querySelectorAll('.seg button').forEach(btn => btn.setAttribute('aria-pressed', String(btn.dataset.b === barber)));

    const list = barber === 'todos' ? [...data[dayIdx].luis, ...data[dayIdx].yago] : data[dayIdx][barber];
    const money = list.filter(a => a.status === 'concluido').reduce((s, a) => s + a.price, 0);
    const gaps = barber === 'todos' ? [] : freeGaps(list);
    document.getElementById('stMoney').textContent = `R$ ${money}`;
    document.getElementById('stCount').textContent = list.length;
    document.getElementById('stFree').textContent = barber === 'todos'
      ? freeGaps(data[dayIdx].luis).length + freeGaps(data[dayIdx].yago).length
      : gaps.length;

    const view = document.getElementById('dayView');
    if (week[dayIdx].closed) { view.innerHTML = '<div class="closed-msg">Barbearia fechada neste dia.</div>'; return; }

    // Linha do tempo vertical
    const tl = document.createElement('div');
    tl.className = 'timeline';
    tl.style.height = ((END - START) * PX_PER_MIN + 20) + 'px';
    const y = (m) => ((m - START) * PX_PER_MIN + 10) + 'px';
    for (let h = 9; h <= 19; h++) {
      tl.insertAdjacentHTML('beforeend', `<div class="hourline" style="top:${y(h * 60)}"><span>${h}h</span></div>`);
    }
    gaps.forEach(([a, b]) => {
      tl.insertAdjacentHTML('beforeend',
        `<div class="slot" style="top:calc(${y(a)} + 3px);height:${(b - a) * PX_PER_MIN - 6}px"><div class="free"><span>Livre ${hhmm(a)}–${hhmm(b)}</span><button type="button" onclick="alert('Rascunho: encaixe às ${hhmm(a)}')">Encaixar</button></div></div>`);
    });
    const sorted = list.slice().sort((a, b) => a.start - b.start);
    sorted.forEach((a, idx) => {
      const st = STATE[a.status];
      // Com "Todos", horários iguais ficam lado a lado
      const twin = barber === 'todos' ? sorted.filter(o => o.start < a.start + a.dur && a.start < o.start + o.dur) : [a];
      const col = twin.indexOf(a), cols = twin.length;
      // Altura proporcional à duração; atendimentos curtos usam o formato compacto (uma linha)
      const h = a.dur * PX_PER_MIN - 6;
      const compact = h < 80;
      const el = document.createElement('div');
      el.className = 'slot';
      el.style.top = `calc(${y(a.start)} + 3px)`;
      el.style.height = h + 'px';
      if (cols > 1) { el.style.left = `calc(52px + ${col} * (100% - 52px) / ${cols})`; el.style.right = 'auto'; el.style.width = `calc((100% - 52px) / ${cols} - 4px)`; }
      el.innerHTML = `
        <div class="appt s-${a.status}${compact ? ' compact' : ''}" style="height:100%">
          <div class="info">
            ${compact
              ? `<div class="name"><span class="t">${hhmm(a.start)}</span> ${a.name}</div>`
              : `<div class="t">${hhmm(a.start)}–${hhmm(a.start + a.dur)}${barber === 'todos' ? ' · ' + (a.barber === 'luis' ? 'Luis' : 'Yago') : ''}</div>
                 <div class="name">${a.name}</div>
                 ${h > 110 ? `<div class="svc">${a.svc} · R$ ${a.price}</div>` : ''}
                 <div class="state">${st.label}</div>`}
          </div>
          <div class="acts">
            ${st.action && cols === 1 ? `<button class="go" type="button" data-id="${a.id}">${st.action}</button>` : ''}
            <button class="more" type="button" aria-label="Mais opções" data-more="${a.id}">⋯</button>
          </div>
        </div>`;
      tl.appendChild(el);
    });
    if (dayIdx === TODAY) tl.insertAdjacentHTML('beforeend', `<div class="now" style="top:${y(NOW)}" title="Agora"><span>${hhmm(NOW)}</span></div>`);
    // Faixa dos dias abre centralizada no dia escolhido
    const selDay = daysEl.querySelector('[aria-pressed="true"]');
    if (selDay) daysEl.scrollLeft = selDay.offsetLeft - daysEl.clientWidth / 2 + selDay.clientWidth / 2;
    view.innerHTML = '';
    view.appendChild(tl);

    view.querySelectorAll('.go').forEach(b => b.onclick = () => {
      const a = [...data[dayIdx].luis, ...data[dayIdx].yago].find(x => x.id === b.dataset.id);
      if (a.status === 'atendendo' && !confirm(`Cobrar ${a.name}: ${a.svc}, R$ ${a.price}?`)) return;
      a.status = STATE[a.status].next; render();
    });
    view.querySelectorAll('[data-more]').forEach(b => b.onclick = () => {
      const a = [...data[dayIdx].luis, ...data[dayIdx].yago].find(x => x.id === b.dataset.more);
      document.getElementById('sheetTitle').textContent = a.name;
      document.getElementById('sheetSub').textContent = `${hhmm(a.start)} · ${a.svc} · R$ ${a.price}`;
      document.getElementById('app').parentElement.classList.add('open');
    });
  }
  document.getElementById('sheetBg').onclick = () => document.body.classList.remove('open');
  document.querySelectorAll('#sheet button').forEach(b => b.onclick = () => document.body.classList.remove('open'));
  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { barber = b.dataset.b; render(); });
  render();
</script>
</body>
</html>
